name: Nider Text para Windows

on:
  workflow_dispatch:
    inputs:
      versao:
        description: "Publicar esta versão (ex.: 1.2.3-beta). Vazio = só compilar, sem publicar."
        required: false
        default: ""
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  # A versão a publicar: a da etiqueta (push de tag) ou a digitada no "Run workflow".
  PUBLICAR: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || (github.event.inputs.versao != '' && format('v{0}', github.event.inputs.versao) || '') }}

jobs:
  windows:
    name: Windows x64
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: 0
      WORDCRAFT_BUILD_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # O Nider Terminal mostra "Compilando a versão …" enquanto existe a etiqueta sem instalador:
      # com "Run workflow", a etiqueta nasce já aqui (empurrada pelo GITHUB_TOKEN, que não dispara
      # outra compilação) em vez de só no fim, junto com a versão.
      - name: Etiqueta no início (Nider Terminal mostra a compilação)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.versao != ''
        shell: bash
        run: |
          tag="${PUBLICAR#vv}"; tag="v${tag#v}"
          if ! git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
            git tag "$tag" "$GITHUB_SHA"
            git push origin "refs/tags/$tag"
          fi
      - name: Fontes do WordCraft (craft-fonts)
        uses: actions/checkout@v7
        with:
          repository: storytold/craft-fonts
          ref: 8dcdacd5153e64560d109541a47d806f26f048c0
          path: craft-fonts
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          key: nider-text-windows-x64
      - name: Aplicar a versão da etiqueta
        if: env.PUBLICAR != ''
        shell: bash
        run: cargo xtask version set "${PUBLICAR#v}"
      - name: Instalar WiX
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2
          wix extension add -g "WixToolset.UI.wixext/5.0.2" "WixToolset.Util.wixext/5.0.2"
      - name: Compilar e empacotar
        shell: pwsh
        env:
          CRAFT_FONTS_DIR: ${{ github.workspace }}/craft-fonts
          CRAFT_FONTS_REQUIRED: "1"
        run: ./packaging/windows/package.ps1 -Arch x64
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "8.0.x"
      - name: Instalador personalizado (NiderTextSetup.exe)
        shell: pwsh
        run: |
          $zip = Get-ChildItem dist/release -Filter "wordcraft-*-portable.zip" | Select-Object -First 1
          if (-not $zip) { throw "zip portátil não encontrado" }
          Copy-Item $zip.FullName installer/NiderTextSetup/payload.zip
          $v = ($zip.Name -replace '^wordcraft-', '' -replace '-windows-x64-portable\.zip$', '')
          $v3 = ($v -split '-')[0]
          dotnet publish installer/NiderTextSetup -c Release -p:Version=$v3 -o dist/setup
          if ($LASTEXITCODE -ne 0) { throw "falha ao compilar o instalador" }
          Copy-Item dist/setup/NiderTextSetup.exe "dist/release/nider-text-setup-$v-windows-x64.exe"
      - name: Renomear arquivos
        shell: pwsh
        run: |
          Get-ChildItem dist/release -File | Where-Object { $_.Name -like 'wordcraft-*' } | ForEach-Object {
            Rename-Item $_.FullName ($_.Name -replace '^wordcraft-', 'nider-text-')
          }
          Get-ChildItem dist/release
      - uses: actions/upload-artifact@v7
        with:
          name: nider-text-windows-x64
          path: dist/release/*
          if-no-files-found: error
      - name: Notas da versão (o que mudou desde a versão anterior)
        if: env.PUBLICAR != '' || github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          atual="${PUBLICAR:-$GITHUB_REF_NAME}"
          git rev-parse -q --verify "refs/tags/$atual" >/dev/null || atual="HEAD"
          anterior=$(git describe --tags --abbrev=0 --match 'v*' "$atual^" 2>/dev/null || true)
          {
            echo "## O que há de novo"
            echo
            git log ${anterior:+$anterior..}$atual --no-merges --pretty='- %s' \
              | grep -v -i -E 'dependabot|^- (bump|chore\(deps\)|ci\(deps\))|ui_shot|^- Merge |^- (Compilação|Empacotamento|Notas da versão|Instalador:)' | head -40 || true
            echo
            echo "_Se o Windows avisar que o aplicativo não é reconhecido, clique em **Mais informações** e depois em **Executar assim mesmo**._"
          } > notas.md
          cat notas.md
      - name: Publicar versão no GitHub
        if: env.PUBLICAR != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${PUBLICAR#vv}"; tag="v${tag#v}"
          gh release create "$tag" --target "$GITHUB_SHA" dist/release/nider-text-* --title "Nider Text $tag" --prerelease \
            --notes-file notas.md
      # Falhou: a etiqueta sem versão sai, para o Nider Terminal não ficar mostrando "Compilando".
      - name: Tirar a etiqueta se a compilação falhou
        if: failure() && env.PUBLICAR != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${PUBLICAR#vv}"; tag="v${tag#v}"
          gh release view "$tag" >/dev/null 2>&1 || git push origin ":refs/tags/$tag" || true
